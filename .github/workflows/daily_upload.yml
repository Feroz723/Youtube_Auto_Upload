name: Daily YouTube Short Upload

on:
  schedule:
    # Note: GitHub Actions uses UTC time. IST is UTC+5:30 (UTC = IST - 5 hours 30 minutes).
    # Weekdays (Monday–Friday): 7:00 PM IST (19:00 IST) -> 13:30 UTC
    - cron: "30 13 * * 1-5"

    # Saturday: 11:00 AM IST (11:00 IST) -> 05:30 UTC
    - cron: "30 5 * * 6"

    # Sunday: 10:00 AM IST (10:00 IST) -> 04:30 UTC
    - cron: "30 4 * * 0"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run validation mode (no YouTube upload or Drive move)"
        type: boolean
        required: false
        default: false

concurrency:
  group: youtube-auto-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Execute Upload Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OAuth credentials & token
        env:
          CREDENTIALS_JSON_B64: ${{ secrets.CREDENTIALS_JSON_B64 }}
          TOKEN_JSON_B64: ${{ secrets.TOKEN_JSON_B64 }}
        run: |
          if [ -n "$CREDENTIALS_JSON_B64" ]; then
            echo "$CREDENTIALS_JSON_B64" | base64 --decode > credentials.json
          fi
          if [ -n "$TOKEN_JSON_B64" ]; then
            echo "$TOKEN_JSON_B64" | base64 --decode > token.json
          fi

      - name: Run upload pipeline
        env:
          GOOGLE_DRIVE_VIDEOS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_VIDEOS_FOLDER_ID }}
          GOOGLE_DRIVE_UPLOADED_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_UPLOADED_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_WORKSHEET: ${{ secrets.GOOGLE_SHEET_WORKSHEET }}
          YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}
          LOG_LEVEL: "INFO"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Secure cleanup of credentials
        if: always()
        run: |
          rm -f credentials.json token.json
